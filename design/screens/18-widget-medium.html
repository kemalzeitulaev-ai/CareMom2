<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>CareMom — 18 WIDGET MEDIUM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root {
    /* Brand */
    --warm-coral: #F57A85;
    --primary-pink: #E86B9E;
    --soft-peach: #FFD9C7;
    --lavender: #D1B8E0;
    --cream: #FCF5F5;
    --card: #FFFFFF;
    --text: #382E40;
    --text-sec: #6B6673;
    /* Entry types (Assets.xcassets) */
    --entry-illness: #F27380;
    --entry-medication: #A680D9;
    --entry-feeding: #F2A659;
    --entry-sleep: #73A6E6;
    --entry-doctor: #5CB8A8;
    /* Child avatars (ChildGender) */
    --boy-blue: #6B9EF2;
    --boy-blue-soft: #C7E0FF;
    --girl-peach: #FFD9C7;
    /* Layout */
    --radius-card: 16px;
    --radius-lg: 20px;
    --radius-icon: 12px;
    --shadow-card: 0 4px 12px rgba(232, 107, 158, 0.08);
    --shadow-fab: 0 6px 12px rgba(245, 122, 133, 0.4);
    --phone-w: 390px;
    --phone-h: 844px;
    --pad: 16px;
    --entry-bg-opacity: 0.12;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'SF Pro Display', Inter, sans-serif;
    background: #E8E4E6;
    color: var(--text);
    padding: 40px;
    -webkit-font-smoothing: antialiased;
  }

  h1.page-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  p.subtitle { color: var(--text-sec); margin-bottom: 32px; max-width: 720px; line-height: 1.5; font-size: 15px; }

  /* ── Design System ── */
  .ds-section {
    background: var(--card); border-radius: var(--radius-lg); padding: 32px;
    margin-bottom: 48px; max-width: 1200px; box-shadow: var(--shadow-card);
  }
  .ds-section h2 { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: var(--text); }
  .color-grid { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 32px; }
  .swatch { width: 120px; text-align: center; }
  .swatch-box { width: 120px; height: 72px; border-radius: var(--radius-icon); margin-bottom: 8px; border: 1px solid rgba(0,0,0,0.06); }
  .swatch-name { font-size: 11px; font-weight: 600; }
  .swatch-hex { font-size: 10px; color: var(--text-sec); font-family: ui-monospace, monospace; }
  .components-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }

  /* ── Shared components (match CareMomTheme.swift) ── */
  .care-card {
    background: var(--card); border-radius: var(--radius-card); padding: var(--pad);
    box-shadow: var(--shadow-card);
  }
  .care-card--compact { padding: 14px; }

  .btn-primary {
    background: var(--warm-coral); color: #fff; border: none;
    border-radius: var(--radius-card); padding: 14px 24px;
    font-size: 17px; font-weight: 600; min-height: 48px; font-family: inherit;
  }
  .btn-primary--full { width: 100%; }
  .btn-secondary {
    background: transparent; color: var(--warm-coral);
    border: 1.5px solid var(--warm-coral); border-radius: var(--radius-card);
    padding: 14px 24px; font-size: 17px; font-weight: 600; min-height: 48px; font-family: inherit;
  }
  .btn-soft {
    flex: 1; background: rgba(255, 217, 199, 0.5); border: none;
    border-radius: var(--radius-icon); padding: 12px;
    color: var(--warm-coral); font-weight: 600; font-size: 15px; font-family: inherit;
  }
  .btn-ghost {
    background: var(--card); border: none; border-radius: var(--radius-icon);
    padding: 12px 16px; color: var(--text-sec); font-size: 13px; font-weight: 600; font-family: inherit;
  }
  .btn-link { color: var(--warm-coral); font-size: 17px; background: none; border: none; font-family: inherit; cursor: default; }
  .btn-link--bold { font-weight: 600; }

  .fab {
    width: 60px; height: 60px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--warm-coral), var(--primary-pink));
    color: #fff; font-size: 28px; font-weight: 600; box-shadow: var(--shadow-fab); font-family: inherit;
  }
  .fab-wrap { position: absolute; bottom: 100px; right: 20px; }

  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 20px; flex-shrink: 0;
    border: 3px solid transparent;
  }
  .avatar--girl { background: var(--girl-peach); color: var(--warm-coral); }
  .avatar--boy { background: var(--boy-blue-soft); color: var(--boy-blue); }
  .avatar--selected.avatar--girl { border-color: var(--warm-coral); }
  .avatar--selected.avatar--boy { border-color: var(--boy-blue); }
  .avatar--lg { width: 100px; height: 100px; font-size: 36px; border: none; }
  .avatar--row { width: 44px; height: 44px; font-size: 17px; border: none; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    font-size: 12px; font-weight: 500;
    background: var(--soft-peach); color: var(--text);
  }

  .entry-icon {
    width: 44px; height: 44px; border-radius: var(--radius-icon);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .entry-icon--illness { background: rgba(242,115,128,var(--entry-bg-opacity)); color: var(--entry-illness); }
  .entry-icon--medication { background: rgba(166,128,217,var(--entry-bg-opacity)); color: var(--entry-medication); }
  .entry-icon--feeding { background: rgba(242,166,89,var(--entry-bg-opacity)); color: var(--entry-feeding); }
  .entry-icon--sleep { background: rgba(115,166,230,var(--entry-bg-opacity)); color: var(--entry-sleep); }
  .entry-icon--lg { width: 56px; height: 56px; font-size: 24px; }

  .entry-card {
    background: var(--card); border-radius: var(--radius-card); padding: 14px;
    margin-bottom: 12px; box-shadow: var(--shadow-card);
    display: flex; gap: 14px; align-items: flex-start;
  }
  .entry-card--row { align-items: center; }
  .entry-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .entry-meta { font-size: 12px; color: var(--text-sec); }

  .section-header {
    font-size: 15px; font-weight: 600; color: var(--text-sec);
    margin: 16px 0 8px;
  }

  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .filter-pill {
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
    white-space: nowrap; background: var(--card); color: var(--text);
  }
  .filter-pill.active { background: var(--warm-coral); color: #fff; }

  .type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 16px 0; }
  .type-chip { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; text-align: center; color: var(--text); }
  .type-icon {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .type-icon--illness { background: rgba(242,115,128,0.15); color: var(--entry-illness); }
  .type-icon--illness.selected { background: var(--entry-illness); color: #fff; }
  .type-icon--medication { background: rgba(166,128,217,0.15); color: var(--entry-medication); }
  .type-icon--feeding { background: rgba(242,166,89,0.15); color: var(--entry-feeding); }
  .type-icon--sleep { background: rgba(115,166,230,0.15); color: var(--entry-sleep); }

  .form-field { margin-bottom: 16px; }
  .form-field .care-card { padding: 12px var(--pad); }
  .form-label { font-size: 13px; color: var(--text-sec); margin-bottom: 4px; }
  .form-value { font-size: 17px; color: var(--text); }
  .form-section-title { font-size: 13px; font-weight: 600; color: var(--text-sec); margin-bottom: 8px; }

  .progress-bar { height: 6px; background: var(--soft-peach); border-radius: 3px; margin: 8px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--warm-coral); border-radius: 3px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { background: var(--card); border-radius: var(--radius-card); padding: var(--pad); box-shadow: var(--shadow-card); }
  .stat-value { font-size: 28px; font-weight: 700; margin: 8px 0 4px; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--text-sec); line-height: 1.3; }

  .segmented {
    display: flex; background: var(--card); border-radius: var(--radius-icon);
    padding: 4px; margin-bottom: var(--pad); box-shadow: var(--shadow-card);
  }
  .segmented-item {
    flex: 1; text-align: center; padding: 8px; font-size: 13px;
    color: var(--text-sec); border-radius: 8px;
  }
  .segmented-item.active { background: var(--cream); font-weight: 600; color: var(--text); }

  .grouped-list { margin-bottom: var(--pad); }
  .grouped-list .care-card { padding: 0; overflow: hidden; }
  .list-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px var(--pad); border-bottom: 0.5px solid rgba(0,0,0,0.08);
    font-size: 17px; color: var(--text);
  }
  .list-row:last-child { border-bottom: none; }
  .list-row__chevron { color: var(--text-sec); }
  .list-row__value { color: var(--text-sec); font-size: 17px; }

  .chart-placeholder {
    height: 120px; display: flex; align-items: center; justify-content: center;
    color: var(--text-sec); font-size: 13px;
  }

  .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .gallery-item { aspect-ratio: 1; background: var(--lavender); border-radius: var(--radius-icon); opacity: 0.5; }

  .empty-state { text-align: center; padding: 60px 24px; color: var(--text-sec); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; color: var(--warm-coral); opacity: 0.6; }
  .empty-title { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }

  /* ── Phone shell ── */
  .screens-grid { display: flex; flex-wrap: wrap; gap: 40px; }
  .screen-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .screen-label { font-size: 13px; font-weight: 600; color: var(--text-sec); }

  .phone {
    width: var(--phone-w); height: var(--phone-h); background: var(--cream);
    border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(0,0,0,0.08);
    display: flex; flex-direction: column;
  }
  .status-bar {
    height: 54px; padding: 14px 28px 0; display: flex;
    justify-content: space-between; font-size: 15px; font-weight: 600;
    flex-shrink: 0; color: var(--text);
  }
  .nav-large { padding: 4px var(--pad) 12px; flex-shrink: 0; }
  .nav-large h3 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
  .nav-inline {
    padding: 4px var(--pad) 12px; flex-shrink: 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-inline h3 { font-size: 17px; font-weight: 600; color: var(--text); }
  .nav-inline .btn-link { font-size: 17px; }
  .nav-inline .btn-add { color: var(--warm-coral); font-size: 28px; font-weight: 300; line-height: 1; }

  .content { flex: 1; overflow: hidden; padding: 0 var(--pad) var(--pad); }
  .content--center {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 32px;
  }

  .child-bar { display: flex; gap: 24px; justify-content: center; padding: 8px 0 12px; }
  .child-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text); }
  .child-item--inactive { color: var(--text-sec); }

  .tab-bar {
    height: 83px; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
    border-top: 0.5px solid rgba(0,0,0,0.1); display: flex; justify-content: space-around;
    align-items: flex-start; padding-top: 8px; flex-shrink: 0;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; color: var(--text-sec); }
  .tab.active { color: var(--warm-coral); }
  .tab-icon { font-size: 22px; }

  /* Sheet */
  .sheet-overlay {
    background: rgba(0,0,0,0.3); flex: 1;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .sheet-panel {
    background: var(--cream); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 0 var(--pad) 32px;
  }
  .sheet-panel--center { padding: 24px var(--pad) 40px; text-align: center; }
  .sheet-handle { width: 36px; height: 5px; background: rgba(0,0,0,0.15); border-radius: 3px; margin: 8px auto 16px; }
  .sheet-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--pad);
  }
  .sheet-header__title { font-weight: 600; font-size: 17px; color: var(--text); }

  .onboarding-icon { font-size: 72px; color: var(--warm-coral); margin-bottom: 24px; }
  .onboarding-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
  .onboarding-text { color: var(--text-sec); line-height: 1.5; margin-bottom: 32px; font-size: 17px; }

  .temp-display { font-size: 64px; font-weight: 700; color: var(--warm-coral); margin-bottom: 8px; }

  .detail-header { display: flex; gap: var(--pad); align-items: center; margin-bottom: 24px; }
  .detail-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .detail-subtitle { color: var(--text-sec); font-size: 15px; }

  .profile-header { text-align: center; padding: 24px 0; }
  .profile-name { font-size: 22px; font-weight: 700; color: var(--text); }
  .profile-age { color: var(--text-sec); font-size: 17px; }

  .med-actions { display: flex; gap: 8px; margin-top: 12px; }
  .med-meta { font-size: 12px; color: var(--text-sec); margin-bottom: 8px; }
  .med-progress-label { font-size: 12px; color: var(--text); margin-bottom: 4px; }

  .growth-summary { display: flex; gap: var(--pad); margin-bottom: var(--pad); }
  .growth-divider { width: 1px; background: rgba(0,0,0,0.08); }
  .growth-value { font-size: 22px; font-weight: 700; color: var(--text); }
  .growth-unit { font-size: 12px; font-weight: 400; color: var(--text-sec); }

  .vacc-action { color: var(--warm-coral); font-size: 13px; font-weight: 600; }
  .vacc-done { color: var(--entry-doctor); font-size: 16px; }

  .lock-icon { font-size: 64px; color: var(--warm-coral); margin-bottom: 16px; }
  .lock-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--text); }

  /* Widgets */
  .widget-frame {
    width: 170px; height: 170px; background: var(--cream);
    border-radius: 22px; padding: 14px; box-shadow: var(--shadow-card);
  }
  .widget-md { width: 360px; height: 170px; }
  .widget-brand { font-size: 12px; color: var(--text-sec); margin-bottom: 8px; }
  .widget-brand--accent { color: var(--warm-coral); font-weight: 600; }
  .widget-name { font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .widget-temp { font-size: 28px; font-weight: 700; color: var(--warm-coral); }
  .widget-stat-label { font-size: 11px; color: var(--text-sec); }
  .widget-stat-value { font-size: 20px; font-weight: 700; }
  .widget-banner {
    margin-top: 10px; background: var(--soft-peach);
    border-radius: var(--radius-icon); padding: 8px; font-size: 12px; color: var(--text);
  }

  .flex-1 { flex: 1; }
  .mb-12 { margin-bottom: 12px; }
  .mb-16 { margin-bottom: 16px; }
  .mt-16 { margin-top: 16px; }
  .w-full { width: 100%; }


  body {
    margin: 0; padding: 0; background: #E8E4E6;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; width: 100vw;
  }
  .screen-wrap { margin: 0; }
  .screen-label { display: none; }
  .phone { box-shadow: none; }

</style>
</head>
<body>
<div class="screen-wrap"><div class="screen-label">18 · Widget Medium</div>
<div class="widget-frame widget-md">
  <div style="display:flex;justify-content:space-between;margin-bottom:10px">
    <span class="widget-brand widget-brand--accent">❤️ CareMom</span>
    <span class="widget-stat-label">9:41</span>
  </div>
  <div class="widget-name" style="font-size:18px;margin-bottom:12px">Маша</div>
  <div style="display:flex;gap:24px">
    <div>
      <div class="widget-stat-label">🌡 Температура</div>
      <div class="widget-stat-value" style="color:var(--lavender)">37.4°</div>
    </div>
    <div>
      <div class="widget-stat-label">❤️ Болел</div>
      <div class="widget-stat-value" style="color:var(--warm-coral)">1</div>
    </div>
  </div>
  <div class="widget-banner">💊 Нурофен · 14:00</div>
</div></div>
</body>
</html>
